interface:
  display_name: "Information Accessibility Auditor"
  short_description: "対象・範囲・証拠・未検証を固定して汎用アクセシビリティ監査を実行"
  default_prompt: "Use $information-accessibility-practice to audit the named target. For a Web URL or local Web target with no named profile, use web-modern and inspect all 55 WCAG 2.2 A/AA requirements through a versioned audit run. An assessment whose 55 profile outcomes are all not_tested is initialization, not completion. Exercise every supported safe read-only check, register target-specific E0/E1 SCREEN-* evidence, and enumerate all 55 requirements exactly once in the report projection or a separate not_applicable section. Use the report labels 適合, 不適合, 要確認, and 未確認 exactly; give not_applicable a rationale, and use 未確認 only when the needed test was unavailable with the next test named. Keep machine-readable AI profile rows unverified and not_tested. Return zero omitted requirements, category counts, main barriers, evidence paths, and next human checks without requiring a long template, overclaiming conformance, or modifying the target."
