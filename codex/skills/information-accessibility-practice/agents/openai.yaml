interface:
  display_name: "Information Accessibility Auditor"
  short_description: "必要な検査の深さ・範囲・成果物を決めてアクセシビリティを検査"
  default_prompt: "Use $information-accessibility-practice to audit the named target. Before inspecting, select quick or detailed from the requested report use, and agree scope and environments. Reuse an explicit conversation choice; ask once if unclear. Do not ask again for a clear existing choice. Initialize with --inspection-mode and --inspection-purpose. For a Web URL or local Web target with no named profile, use web-modern and retain all 55 WCAG 2.2 A/AA requirements through a versioned audit run. An assessment whose 55 profile outcomes are all not_tested is initialization, not completion. Exercise the supported safe read-only checks agreed for the selected level, register target-specific E0/E1 SCREEN-* evidence, and enumerate all 55 requirements exactly once in the underlying report projection or a separate not_applicable section. Use the report labels 適合, 不適合, 要確認, and 未確認 exactly; give not_applicable a rationale, and explain whether 未確認 means an unavailable test or a check outside the agreed depth, with the next test named. Keep machine-readable AI profile rows unverified and not_tested. Quick delivers a short decision summary; detailed adds reproduction steps, concrete changes, retest procedures and complete results. Compare each requested completion criterion with evidence and delivered sections; unmet conditions mean partial delivery with next steps. Return zero omitted requirements, category counts, main barriers, evidence paths, and next human checks without requiring a long template, overclaiming conformance, or modifying the target."
