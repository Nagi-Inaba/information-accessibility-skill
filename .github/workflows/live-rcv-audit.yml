name: Temporary RCV live accessibility audit

on:
  push:
    branches:
      - feat/scan-web-deterministic
    paths:
      - .github/workflows/live-rcv-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact browser audit dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.13.0
      - name: Install Chromium
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: Run deterministic scan-web
        shell: bash
        run: |
          mkdir -p live-audit/screenshots
          set +e
          node codex/skills/information-accessibility-practice/scripts/accessibility-audit.mjs scan-web \
            --url "https://rcv.team-mir.ai/" \
            --profile web-modern \
            --output live-audit/automated-scan.json \
            --context-output live-audit/automated-context.json \
            > live-audit/scan-web.stdout.txt \
            2> live-audit/scan-web.stderr.txt
          code=$?
          echo "$code" > live-audit/scan-web.exit-code.txt
          exit 0
      - name: Capture read-only browser evidence and run axe
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          import axe from 'axe-core';

          const out = 'live-audit';
          const url = 'https://rcv.team-mir.ai/';
          const consoleMessages = [];
          const pageErrors = [];
          const failedRequests = [];
          const responses = [];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 800 },
            locale: 'ja-JP',
            timezoneId: 'Asia/Tokyo',
            colorScheme: 'light',
            reducedMotion: 'reduce'
          });
          const page = await context.newPage();
          page.on('console', msg => consoleMessages.push({ type: msg.type(), text: msg.text() }));
          page.on('pageerror', error => pageErrors.push({ name: error.name, message: error.message }));
          page.on('requestfailed', request => failedRequests.push({ url: request.url().replace(/[?#].*$/u, ''), method: request.method(), resourceType: request.resourceType(), failure: request.failure()?.errorText ?? null }));
          page.on('response', response => {
            if (responses.length < 300) responses.push({ url: response.url().replace(/[?#].*$/u, ''), status: response.status(), resourceType: response.request().resourceType() });
          });

          const startedAt = new Date().toISOString();
          let mainResponse = null;
          let navigationError = null;
          try {
            mainResponse = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
            await page.waitForTimeout(2000);
          } catch (error) {
            navigationError = { name: error.name, message: error.message };
          }

          const basic = await page.evaluate(() => {
            const text = (el) => (el?.innerText || el?.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 500);
            const safeHref = (value) => {
              try {
                const u = new URL(value, location.href);
                u.search = '';
                u.hash = '';
                return u.href;
              } catch { return value || ''; }
            };
            const accessibleNameHint = (el) => el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || el.getAttribute('title') || text(el);
            const controls = Array.from(document.querySelectorAll('a[href],button,input,select,textarea,[role],[tabindex]')).slice(0, 500).map((el, index) => ({
              index,
              tag: el.tagName.toLowerCase(),
              type: el.getAttribute('type'),
              role: el.getAttribute('role'),
              id: el.id || null,
              name: el.getAttribute('name'),
              ariaLabel: el.getAttribute('aria-label'),
              ariaLabelledby: el.getAttribute('aria-labelledby'),
              ariaDescribedby: el.getAttribute('aria-describedby'),
              ariaChecked: el.getAttribute('aria-checked'),
              ariaPressed: el.getAttribute('aria-pressed'),
              ariaExpanded: el.getAttribute('aria-expanded'),
              checked: 'checked' in el ? Boolean(el.checked) : null,
              disabled: 'disabled' in el ? Boolean(el.disabled) : null,
              tabIndex: el.tabIndex,
              href: el instanceof HTMLAnchorElement ? safeHref(el.href) : null,
              text: text(el),
              accessibleNameHint: accessibleNameHint(el),
              outerHTML: el.outerHTML.slice(0, 2000)
            }));
            return {
              url: location.href.replace(/[?#].*$/u, ''),
              title: document.title,
              lang: document.documentElement.lang || null,
              bodyText: text(document.body).slice(0, 10000),
              headings: Array.from(document.querySelectorAll('h1,h2,h3,h4,h5,h6')).map(el => ({ level: Number(el.tagName.slice(1)), text: text(el), id: el.id || null })),
              landmarks: Array.from(document.querySelectorAll('main,nav,header,footer,aside,form,[role="main"],[role="navigation"],[role="banner"],[role="contentinfo"],[role="form"]')).map(el => ({ tag: el.tagName.toLowerCase(), role: el.getAttribute('role'), label: el.getAttribute('aria-label'), labelledby: el.getAttribute('aria-labelledby'), text: text(el).slice(0, 500) })),
              liveRegions: Array.from(document.querySelectorAll('[aria-live],[role="alert"],[role="status"],[role="log"]')).map(el => ({ tag: el.tagName.toLowerCase(), role: el.getAttribute('role'), ariaLive: el.getAttribute('aria-live'), ariaAtomic: el.getAttribute('aria-atomic'), text: text(el), outerHTML: el.outerHTML.slice(0, 2000) })),
              controls,
              links: Array.from(document.querySelectorAll('a[href]')).map(el => ({ text: text(el), href: safeHref(el.href), ariaLabel: el.getAttribute('aria-label') })).slice(0, 500),
              forms: Array.from(document.forms).map(form => ({ action: safeHref(form.action), method: form.method, text: text(form).slice(0, 1000), outerHTML: form.outerHTML.slice(0, 5000) })),
              images: Array.from(document.images).map(img => ({ src: safeHref(img.src), alt: img.getAttribute('alt'), role: img.getAttribute('role'), width: img.width, height: img.height })).slice(0, 300)
            };
          }).catch(error => ({ evaluationError: error.message }));

          const tabOrder = [];
          for (let i = 0; i < 30; i += 1) {
            await page.keyboard.press('Tab');
            await page.waitForTimeout(100);
            const active = await page.evaluate(() => {
              const el = document.activeElement;
              if (!el) return null;
              const text = (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 300);
              const rect = el.getBoundingClientRect();
              const style = getComputedStyle(el);
              return {
                tag: el.tagName.toLowerCase(),
                type: el.getAttribute('type'),
                id: el.id || null,
                role: el.getAttribute('role'),
                ariaLabel: el.getAttribute('aria-label'),
                ariaLabelledby: el.getAttribute('aria-labelledby'),
                text,
                tabIndex: el.tabIndex,
                href: el instanceof HTMLAnchorElement ? el.href.replace(/[?#].*$/u, '') : null,
                rect: { x: Math.round(rect.x), y: Math.round(rect.y), width: Math.round(rect.width), height: Math.round(rect.height) },
                focusStyle: { outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth, outlineColor: style.outlineColor, boxShadow: style.boxShadow }
              };
            });
            tabOrder.push(active);
          }

          await page.screenshot({ path: `${out}/screenshots/root-full.png`, fullPage: true });
          await page.screenshot({ path: `${out}/screenshots/root-after-tabs.png`, fullPage: false });

          const originalViewport = page.viewportSize();
          await page.setViewportSize({ width: 320, height: 800 });
          await page.waitForTimeout(500);
          const reflow = await page.evaluate(() => {
            const viewportWidth = document.documentElement.clientWidth;
            const candidates = Array.from(document.querySelectorAll('body *')).map(el => {
              const rect = el.getBoundingClientRect();
              return { el, rect };
            }).filter(({ rect }) => rect.width > 0 && (rect.right > viewportWidth + 1 || rect.left < -1 || rect.width > viewportWidth + 1)).slice(0, 100).map(({ el, rect }) => ({
              tag: el.tagName.toLowerCase(),
              id: el.id || null,
              className: typeof el.className === 'string' ? el.className.slice(0, 300) : null,
              text: (el.innerText || el.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 300),
              rect: { left: Math.round(rect.left), right: Math.round(rect.right), width: Math.round(rect.width) },
              outerHTML: el.outerHTML.slice(0, 1500)
            }));
            return {
              viewportWidth,
              documentClientWidth: document.documentElement.clientWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body?.scrollWidth ?? null,
              candidates
            };
          });
          await page.screenshot({ path: `${out}/screenshots/root-320px.png`, fullPage: true });
          if (originalViewport) await page.setViewportSize(originalViewport);

          let axeResults = null;
          let axeError = null;
          try {
            await page.evaluate(axeSource => { (0, eval)(axeSource); }, axe.source);
            axeResults = await page.evaluate(async () => await globalThis.axe.run(document, { resultTypes: ['violations', 'incomplete', 'passes', 'inapplicable'] }));
          } catch (error) {
            axeError = { name: error.name, message: error.message };
          }

          let axTree = null;
          let axError = null;
          try {
            const cdp = await context.newCDPSession(page);
            await cdp.send('Accessibility.enable');
            axTree = await cdp.send('Accessibility.getFullAXTree');
          } catch (error) {
            axError = { name: error.name, message: error.message };
          }

          const html = await page.content().catch(() => '');
          fs.writeFileSync(`${out}/root.html`, html);
          fs.writeFileSync(`${out}/browser-evidence.json`, JSON.stringify({
            startedAt,
            finishedAt: new Date().toISOString(),
            requestedUrl: url,
            mainResponse: mainResponse ? { url: mainResponse.url().replace(/[?#].*$/u, ''), status: mainResponse.status(), headers: mainResponse.headers() } : null,
            navigationError,
            basic,
            tabOrder,
            reflow,
            axeError,
            axeResults,
            axError,
            axTree,
            consoleMessages,
            pageErrors,
            failedRequests,
            responses
          }, null, 2));
          await browser.close();
          NODE
      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcv-team-mir-ai-live-audit
          path: live-audit
          retention-days: 3
          if-no-files-found: error
