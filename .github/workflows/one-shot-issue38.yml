name: Finalize issue 38
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-38-validator-reportability
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fix and test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '''  } else if (results.some((result) => result.outcome === "fail")) {\n    warnings.push("Legacy assessment record has failed results but no structured findings; use findings to make remediation and retest traceable.");\n  }'''
          new = '''  } else if (results.some((result) => result.outcome === "fail")) {\n    errors.push("Failed results require structured findings before the assessment can be reported.");\n  }'''
          for base in ["codex", "claude"]:
              p = Path(base) / "skills/information-accessibility-practice/scripts/validate-assessment.mjs"
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected validator shape: {p}")
              p.write_text(text.replace(old, new))
          p = Path("tests/audit-report.test.mjs")
          text = p.read_text()
          marker = 'test("report judgement vocabulary and overall priority are fixed", () => {'
          test = '''test("validator rejects failed results without structured findings so valid records remain reportable", () => {\n  const record = reviewedRecord();\n  delete record.assessment.findings;\n  const result = validate(record);\n  assert.equal(result.valid, false);\n  assert.ok(result.errors.some((error) => error.includes("Failed results require structured findings")));\n});\n\n'''
          if test not in text:
              if marker not in text: raise SystemExit("test insertion marker missing")
              p.write_text(text.replace(marker, test + marker, 1))
          PY
      - name: Verify
        run: |
          node --test tests/audit-report.test.mjs
          node scripts/verify-package.mjs
          node scripts/build-criteria-catalog.mjs --check
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue38.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/scripts/validate-assessment.mjs claude/skills/information-accessibility-practice/scripts/validate-assessment.mjs tests/audit-report.test.mjs .github/workflows/one-shot-issue38.yml
          git commit -m "fix: align assessment validation with report requirements"
          git push origin HEAD:fix/issue-38-validator-reportability