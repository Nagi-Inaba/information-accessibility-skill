name: One-shot issue 36 fix

on:
  push:
    branches:
      - fix/issue-36-empty-coverage-judgement

permissions:
  contents: write

concurrency:
  group: issue-36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-36-empty-coverage-judgement
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fix and regression test
        shell: bash
        run: |
          python - <<'PYCODE'
          from base64 import b64decode
          from pathlib import Path

          paths = [
              Path("codex/skills/information-accessibility-practice/scripts/validate-assessment.mjs"),
              Path("claude/skills/information-accessibility-practice/scripts/validate-assessment.mjs"),
          ]
          anchor = (
              "  const evaluatedRequirementCount = humanVerifiedRequirementIds.size;\n"
              "\n"
              "  return {\n"
          )
          replacement = (
              "  const evaluatedRequirementCount = humanVerifiedRequirementIds.size;\n"
              "  const reportProfileOutcomeCounts = { ...profileOutcomeCounts };\n"
              "  reportProfileOutcomeCounts.not_tested += missingRequirementIds.length;\n"
              "  const reportProfileGroupOutcomeCounts = new Map(\n"
              "    [...profileGroupOutcomeCounts].map(([groupId, counts]) => [groupId, { ...counts }])\n"
              "  );\n"
              "  for (const requirementId of missingRequirementIds) {\n"
              "    try {\n"
              "      const group = groupForRequirement(profile, requirementId);\n"
              "      if (!reportProfileGroupOutcomeCounts.has(group)) {\n"
              "        reportProfileGroupOutcomeCounts.set(\n"
              "          group,\n"
              "          Object.fromEntries(registry.outcomes.map((outcome) => [outcome, 0]))\n"
              "        );\n"
              "      }\n"
              "      reportProfileGroupOutcomeCounts.get(group).not_tested += 1;\n"
              "    } catch (error) {\n"
              "      errors.push(`Missing profile requirement cannot be assigned to a report group: ${requirementId} (${error instanceof Error ? error.message : String(error)})`);\n"
              "    }\n"
              "  }\n"
              "\n"
              "  return {\n"
          )
          old_counts = (
              "      profile_outcome_counts: profileOutcomeCounts,\n"
              "      profile_group_outcome_counts: Object.fromEntries(profileGroupOutcomeCounts),\n"
          )
          new_counts = (
              "      profile_outcome_counts: reportProfileOutcomeCounts,\n"
              "      profile_group_outcome_counts: Object.fromEntries(reportProfileGroupOutcomeCounts),\n"
          )
          for path in paths:
              text = path.read_text()
              if text.count(anchor) != 1 or text.count(old_counts) != 1:
                  raise SystemExit(f"Unexpected source shape: {path}")
              path.write_text(text.replace(anchor, replacement, 1).replace(old_counts, new_counts, 1))

          Path("tests/report-coverage-guard.test.mjs").write_bytes(b64decode(""))
          PYCODE
      - name: Run focused regression test
        run: node --test tests/report-coverage-guard.test.mjs
      - name: Run package verification
        run: node scripts/verify-package.mjs
      - name: Run all test files except the known Linux path-message assertion
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'authorized-fixer.test.mjs' -print | sort)
          node --test "${files[@]}"
          node --test --test-name-pattern='^(?!validate-fix-authorization CLI rejects invalid target paths$).*' tests/authorized-fixer.test.mjs
      - name: Confirm the known Linux path-message assertion remains isolated
        shell: bash
        run: |
          set +e
          node --test --test-name-pattern='^validate-fix-authorization CLI rejects invalid target paths$' tests/authorized-fixer.test.mjs > /tmp/known-platform-test.log 2>&1
          status=$?
          set -e
          cat /tmp/known-platform-test.log
          test "$status" -eq 1
          grep -F "target file path must not contain ':'" /tmp/known-platform-test.log
      - name: Check generated criteria catalog
        run: node scripts/build-criteria-catalog.mjs --check
      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue36.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            codex/skills/information-accessibility-practice/scripts/validate-assessment.mjs \
            claude/skills/information-accessibility-practice/scripts/validate-assessment.mjs \
            tests/report-coverage-guard.test.mjs \
            .github/workflows/one-shot-issue36.yml
          git commit -m "fix: treat missing profile rows as untested"
          git push origin HEAD:fix/issue-36-empty-coverage-judgement
