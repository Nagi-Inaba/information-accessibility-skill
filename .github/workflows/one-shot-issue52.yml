name: Finalize issue 52

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-52-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-52-claude-default-agents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct Claude installation guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            "README.md": (
              '''Claude で使う場合:\n\n1. `claude/skills/information-accessibility-practice/` を Claude の `skills/` 配下に配置する。\n2. `claude/agents/information-accessibility-reviewer.md` を Claude の `agents/` 配下に配置する。\n3. 情報アクセシビリティを確認したい対象に対して `information-accessibility-reviewer` を使う。''',
              '''Claude で使う場合:\n\n1. `claude/skills/information-accessibility-practice/` を Claude の `skills/` 配下に配置する。\n2. `shared/agents/agent-manifest.json` で `install_by_default: true` の4件に対応する `.md` を、`claude/agents/` から Claude の `agents/` 配下へ配置する。\n3. 既定の4件は、`information-accessibility-reviewer`、`information-accessibility-e1-inspector`、`information-accessibility-human-queue-planner`、`information-accessibility-remediation-planner` である。\n4. specialist agentのdispatchに対応しない環境ではreviewerがlocal fallbackを使う。対応環境では4agentを配置し、役割別の成果物契約を維持する。\n5. 情報アクセシビリティを確認したい対象に対して `information-accessibility-reviewer` を使う。\n\nUnix系環境では、リポジトリルートから次のように既定agentをまとめてコピーできる。配置先は利用中のClaude環境に合わせて変更する。\n\n```sh\nfor id in information-accessibility-reviewer information-accessibility-e1-inspector information-accessibility-human-queue-planner information-accessibility-remediation-planner; do\n  cp "claude/agents/${id}.md" "${CLAUDE_AGENTS_DIR:?set CLAUDE_AGENTS_DIR}/${id}.md"\ndone\n```'''
            ),
            "README.en.md": (
              '''For Claude:\n\n1. Place `claude/skills/information-accessibility-practice/` under the Claude `skills/` directory.\n2. Place `claude/agents/information-accessibility-reviewer.md` under the Claude `agents/` directory.\n3. Use `information-accessibility-reviewer` for the target to be reviewed for information accessibility.''',
              '''For Claude:\n\n1. Place `claude/skills/information-accessibility-practice/` under the Claude `skills/` directory.\n2. From `claude/agents/`, place the four `.md` files corresponding to entries with `install_by_default: true` in `shared/agents/agent-manifest.json` under the Claude `agents/` directory.\n3. The four default agents are `information-accessibility-reviewer`, `information-accessibility-e1-inspector`, `information-accessibility-human-queue-planner`, and `information-accessibility-remediation-planner`.\n4. In a host that cannot dispatch specialist agents, the reviewer uses its local fallback. In a supported host, install all four agents so the role-specific artifact contracts remain available.\n5. Use `information-accessibility-reviewer` for the target to be reviewed for information accessibility.\n\nOn Unix-like systems, copy all default agents from the repository root with the following command after setting the destination for your Claude environment.\n\n```sh\nfor id in information-accessibility-reviewer information-accessibility-e1-inspector information-accessibility-human-queue-planner information-accessibility-remediation-planner; do\n  cp "claude/agents/${id}.md" "${CLAUDE_AGENTS_DIR:?set CLAUDE_AGENTS_DIR}/${id}.md"\ndone\n```'''
            )
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Claude install section changed unexpectedly: {filename}")
              path.write_text(text.replace(old, new, 1))

          Path("tests/claude-install-docs.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";

          const manifest = JSON.parse(fs.readFileSync("shared/agents/agent-manifest.json", "utf8"));
          const defaults = manifest.agents.filter((agent) => agent.install_by_default).map((agent) => agent.id);

          for (const readme of ["README.md", "README.en.md"]) {
            test(`${readme} installs every default Claude agent`, () => {
              const text = fs.readFileSync(readme, "utf8");
              const section = text.split(readme === "README.md" ? "Claude で使う場合:" : "For Claude:")[1];
              assert.ok(section, "Claude section is required");
              for (const id of defaults) assert.match(section, new RegExp(id));
              assert.match(section, /install_by_default/);
              assert.match(section, /local fallback/i);
            });
          }
          ''')
          PY
      - name: Verify documentation contracts
        run: |
          node --test tests/claude-install-docs.test.mjs tests/readme-i18n.test.mjs tests/distribution-sync.test.mjs
          node scripts/verify-package.mjs
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue52.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md README.en.md tests/claude-install-docs.test.mjs .github/workflows/one-shot-issue52.yml
          git commit -m "docs: install all default Claude accessibility agents"
          git push origin HEAD:docs/issue-52-claude-default-agents
