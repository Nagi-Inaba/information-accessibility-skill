name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-assessment-create-and-output
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply safe assessment and output candidate
        run: |
          python scripts/_apply_safe_assessment_output_v2.py
          python scripts/_normalize_safe_output_candidate.py
      - name: Prepare the final tree under test
        run: |
          git fetch origin main
          git rm -f scripts/_apply_safe_assessment_output.py scripts/_apply_safe_assessment_output_v2.py scripts/_normalize_safe_output_candidate.py
          git checkout origin/main -- .github/workflows/verify.yml
      - name: Verify package, catalogs, and tests
        if: runner.os != 'Windows'
        run: TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" node scripts/verify-all.mjs
      - name: Verify package, catalogs, and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          node scripts/verify-all.mjs
      - name: Commit the verified final tree
        if: runner.os == 'Linux' && matrix.node == 22 && success() && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: create validated assessments through the safe writer"
          git push origin HEAD:fix/safe-assessment-create-and-output
