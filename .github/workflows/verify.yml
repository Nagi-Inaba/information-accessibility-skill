name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify package, catalogs, and tests
        if: runner.os != 'Windows'
        run: TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" node scripts/verify-all.mjs
      - name: Verify package, catalogs, and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          node scripts/verify-all.mjs

  integrate-report-ux:
    if: github.event_name == 'pull_request' && github.head_ref == 'integration/report-ux-slice'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/report-ux-slice
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Implement report UX and update behavioral fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing marker: {label}")
              return text.replace(old, new, 1)

          for base in ["codex", "claude"]:
              p = Path(base) / "skills/information-accessibility-practice/scripts/render-audit-report.mjs"
              text = p.read_text()
              marker = '''const outcomeLabels = {\n  pass: "適合",\n  fail: "不適合",\n  not_tested: "未確認",\n  cant_tell: "要確認"\n};'''
              if "export function reportTitleForProfile" not in text:
                  text = replace_once(text, marker, marker + '''\n\nexport function reportTitleForProfile(profileId) {\n  return profileId === "jp-public-web"\n    ? "# JIS X 8341-3:2016＋追加WCAG検査レポート"\n    : "# WCAG検査レポート";\n}''', "title helper")
              old = 'const reportTitle = referenceGuidance ? "# WCAG参照ガイダンス" : "# WCAG検査レポート";'
              if old in text:
                  text = replace_once(text, old, 'const reportTitle = referenceGuidance ? "# WCAG参照ガイダンス" : reportTitleForProfile(assessment.profile.id);', "standalone title")
              old = '    "# WCAG検査レポート",\n    "",\n    reportNotice,\n    "",\n    "> 文書区分：検査・改善ハンドオフ（規格参照のみ）",'
              if old in text:
                  text = replace_once(text, old, '    reportTitleForProfile(model.profile.id),\n    "",\n    reportNotice,\n    "",\n    "> 文書区分：検査・改善ハンドオフ（規格参照のみ）",', "run title")
              old = '''    .map((result) => [\n      result.requirement_id,\n      reportJudgementForOutcome(result.outcome),\n      resultRationale(result)\n    ]);'''
              if old in text:
                  text = replace_once(text, old, '''    .map((result) => [\n      result.requirement_id,\n      reportJudgementForOutcome(result.outcome),\n      result.mapping_status === "human_verified" ? "外部人手レビュー" : result.outcome === "not_tested" ? "未実施" : "補助的スクリーニング",\n      result.evidence?.length ? assessment.evidence_level : "E0",\n      resultRationale(result)\n    ]);''', "standalone origin")
              old = 'publicTable(["達成基準", "判定", "根拠・未確認事項"], judgementRows, "判定対象の達成基準はありません。"),'
              if old in text:
                  text = replace_once(text, old, 'publicTable(["達成基準", "判定", "判定の出所", "証拠レベル", "根拠・未確認事項"], judgementRows, "判定対象の達成基準はありません。"),', "standalone columns")
              old = '''        outcome: result.outcome,\n        rationale: resultRationale(result),\n        applicability: result.outcome === "not_applicable" ? "not_applicable" : "applicable"'''
              if old in text:
                  text = replace_once(text, old, '''        outcome: result.outcome,\n        rationale: resultRationale(result),\n        applicability: result.outcome === "not_applicable" ? "not_applicable" : "applicable",\n        origin: "external_human_review",\n        evidence_level: "E2"''', "human origin")
              old = 'checks.push({ requirement_id: result.requirement_id, outcome: "not_tested", rationale: "この検査では確認していません。", applicability: "undetermined" });'
              if old in text:
                  text = replace_once(text, old, 'checks.push({ requirement_id: result.requirement_id, outcome: "not_tested", rationale: "この検査では確認していません。", applicability: "undetermined", origin: "not_performed", evidence_level: "E0" });', "missing origin")
              old = '''      outcome: observation.report_outcome,\n      rationale: observation.report_rationale,\n      applicability: observation.applicability'''
              if old in text:
                  text = replace_once(text, old, '''      outcome: observation.report_outcome,\n      rationale: observation.report_rationale,\n      applicability: observation.applicability,\n      origin: "ai_screening",\n      evidence_level: observation.evidence_level''', "screening origin")
              old = '''      ["達成基準・検査項目", "判定", "根拠・未確認事項"],\n      reportChecks.map((item) => [item.requirement_id, reportJudgementForOutcome(item.outcome), item.rationale]),'''
              if old in text:
                  text = replace_once(text, old, '''      ["達成基準・検査項目", "判定", "判定の出所", "証拠レベル", "根拠・未確認事項"],\n      reportChecks.map((item) => [\n        item.requirement_id,\n        reportJudgementForOutcome(item.outcome),\n        item.origin === "external_human_review" ? "外部人手レビュー" : item.origin === "ai_screening" ? "AIスクリーニング" : "未実施",\n        item.evidence_level,\n        item.rationale\n      ]),''', "run columns")
              old = '''    `- 適用対象外件数: ${count(profileCounts, "not_applicable")}`,\n    "",\n    "## 2. 検査対象",'''
              if old in text:
                  text = replace_once(text, old, '''    `- 適用対象外件数: ${count(profileCounts, "not_applicable")}`,\n    "",\n    "### 表明可能な範囲",\n    "",\n    `- 要求した表明レベル: ${cell(assessment.claim.requested_tier)}`,\n    `- 証拠から許される上限: ${cell(guard.max_tier)}`,\n    `- 表明文: ${cell(assessment.claim.proposed_wording)}`,\n    "",\n    "## 2. 検査対象",''', "standalone claim")
              old = '''    `- 適用対象外: ${notApplicableChecks.length}`,\n    "",\n    "## 2. 検査対象",'''
              if old in text:
                  text = replace_once(text, old, '''    `- 適用対象外: ${notApplicableChecks.length}`,\n    "",\n    "### 表明可能な範囲",\n    "",\n    `- 表明レベル: ${cell(model.claim.tier)}`,\n    `- 表明文: ${cell(model.claim.wording)}`,\n    "",\n    "## 2. 検査対象",''', "run claim")
              p.write_text(text)

          test_path = Path("tests/audit-report.test.mjs")
          test_text = test_path.read_text()
          old = r'assert.match(report, /\| WCAG-2\.2-SC-2\.4\.2 \| 不適合 \| The inspected page title does not identify the page topic\. \|/);'
          new = r'assert.match(report, /\| WCAG-2\.2-SC-2\.4\.2 \| 不適合 \| AIスクリーニング \| E1 \| The inspected page title does not identify the page topic\. \|/);'
          if old not in test_text: raise SystemExit("old report fixture expectation not found")
          test_path.write_text(test_text.replace(old, new, 1))

          Path("tests/report-ux-stage1.test.mjs").write_text(r'''import assert from "node:assert/strict";
import fs from "node:fs";
import path from "node:path";
import test from "node:test";
import { generateAssessment } from "../codex/skills/information-accessibility-practice/scripts/generate-assessment.mjs";
import { validateAssessment } from "../codex/skills/information-accessibility-practice/scripts/validate-assessment.mjs";
import { renderAuditReport, reportTitleForProfile } from "../codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs";
const skill = path.resolve("codex/skills/information-accessibility-practice");
const read = (name) => JSON.parse(fs.readFileSync(path.join(skill, "references", name), "utf8"));
test("profile title and report provenance are visible", () => {
  assert.match(reportTitleForProfile("jp-public-web"), /JIS X 8341-3:2016/u);
  const record = generateAssessment("web-modern", {targetName:"Example",targetVersion:"v1",targetRefs:["https://example.invalid/"],evaluator:"Reviewer",evaluatedAt:"2026-08-22"});
  const validation = validateAssessment(record, read("standards-registry.json"), read("assessment-record.schema.json"), read("criteria-catalog.json"), read("web-audit-methods.json"));
  assert.equal(validation.valid, true, validation.errors.join("; "));
  const report = renderAuditReport(record, validation);
  assert.match(report, /判定の出所/u);
  assert.match(report, /証拠レベル/u);
  assert.match(report, /表明可能な範囲/u);
});
''')
          PY
      - name: Verify implementation
        run: |
          node --test tests/report-ux-stage1.test.mjs tests/audit-report.test.mjs tests/reference-only-report-mode.test.mjs
          node scripts/verify-all.mjs
      - name: Commit verified implementation and restore CI workflow
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/verify.yml
          rm -f .github/workflows/one-shot-report-ux-slice.yml .github/workflows/finalize-report-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve report titles, evidence provenance, and claim range"
          git push origin HEAD:integration/report-ux-slice
