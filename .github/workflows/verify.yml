name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verify package, catalogs, and tests
        if: runner.os != 'Windows'
        run: node scripts/verify-all.mjs
      - name: Verify package, catalogs, and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          node scripts/verify-all.mjs
