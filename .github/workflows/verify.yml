name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Apply issue 36 candidate implementation
        run: python scripts/_apply_issue_36.py
      - name: Verify package, catalogs, and tests
        if: runner.os != 'Windows'
        run: TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" TMPDIR="$RUNNER_TEMP" node scripts/verify-all.mjs
      - name: Verify package, catalogs, and tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:TMPDIR = $env:RUNNER_TEMP
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          node scripts/verify-all.mjs
      - name: Upload verified issue 36 files
        if: runner.os == 'Linux' && matrix.node == 22 && success()
        uses: actions/upload-artifact@v4
        with:
          name: issue-36-verified-files
          if-no-files-found: error
          retention-days: 1
          path: |
            README.md
            README.en.md
            codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs
            claude/skills/information-accessibility-practice/scripts/render-audit-report.mjs
            tests/reference-only-report-mode.test.mjs
