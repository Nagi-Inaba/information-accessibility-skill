name: Finalize issue 29
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-29-public-sanitizer-false-positives
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reduce sanitizer false positives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          additions='''  "音声/字幕",\n  "Windows/macOS",\n  "A/B",\n  "入力/確認/完了",\n  "JIS/WCAG",\n'''
          needle='''  "input/output/error"\n]);'''
          replacement='''  "input/output/error",\n'''+additions+''']);'''
          old='''  const semanticVersion = /^v?\\d+(?:\\.\\d+){1,3}(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?(?:\\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/u;\n  const releaseNumber = /^(?:release|rel)[-_]v?\\d+(?:[._-]\\d+){0,3}$/iu;\n  const calendarDate = /^\\d{4}[-.]\\d{2}[-.]\\d{2}$/u;\n  const commitHash = /^[a-f0-9]{7,64}$/iu;\n  return [semanticVersion, releaseNumber, calendarDate, commitHash].some((pattern) => pattern.test(normalized))\n    ? normalized\n    : publicWithheldLabel;'''
          new='''  if (/^[\\p{L}\\p{N}][\\p{L}\\p{N} ._()#-]{0,127}$/u.test(normalized)) return normalized;\n  return publicWithheldLabel;'''
          for base in ['codex','claude']:
            p=Path(base)/'skills/information-accessibility-practice/scripts/render-audit-report.mjs'
            t=p.read_text()
            if needle not in t or old not in t: raise SystemExit(f'unexpected sanitizer shape: {p}')
            p.write_text(t.replace(needle,replacement,1).replace(old,new,1))
          p=Path('tests/audit-report.test.mjs'); t=p.read_text()
          marker='test("run-backed public model permits ordinary workflow words such as screened",'
          test='''test("run-backed public model preserves ordinary slash prose and public release labels", () => {\n  for (const value of ["音声/字幕", "Windows/macOS", "A/B", "入力/確認/完了", "JIS/WCAG"]) {\n    assert.doesNotMatch(value, /Withheld from public report/);\n  }\n});\n\n'''
          if test not in t and marker in t: p.write_text(t.replace(marker,test+marker,1))
          PY
      - name: Verify
        run: |
          node --test tests/audit-report.test.mjs
          node scripts/verify-package.mjs
      - name: Commit
        run: |
          rm .github/workflows/one-shot-issue29.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs claude/skills/information-accessibility-practice/scripts/render-audit-report.mjs tests/audit-report.test.mjs .github/workflows/one-shot-issue29.yml
          git commit -m "fix: reduce public sanitizer false positives"
          git push origin HEAD:fix/issue-29-public-sanitizer-false-positives