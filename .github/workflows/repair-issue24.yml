name: Repair and finalize issue 24

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: repair-issue-24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-24-additional-wcag-screening-id
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply production fix
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path

          old_pattern = r'^(?:WCAG-2\\.2-SC-[0-9]+(?:\\.[0-9]+){2}|JIS-X-8341-3-2016-SC-[0-9]+(?:\\.[0-9]+){2})$'
          new_pattern = r'^(?:WCAG-2\\.2-SC-[0-9]+(?:\\.[0-9]+){2}|WCAG-2\\.2-ADDITIONAL-SC-[0-9]+(?:\\.[0-9]+){2}|JIS-X-8341-3-2016-SC-[0-9]+(?:\\.[0-9]+){2})$'
          old_hash = "c1d50902738383184fe5ca27831f65f8f6926214bc7370a4ada6752b326033fa"
          new_hash = "c595143bb47dd4394e10cda0b737b7fa4756c276ab2b5a2d4bf231ab6a255c0f"

          schema_paths = [
              Path("codex/skills/information-accessibility-practice/references/screening-observations.schema.json"),
              Path("claude/skills/information-accessibility-practice/references/screening-observations.schema.json"),
          ]
          hash_paths = [
              Path("codex/skills/information-accessibility-practice/references/orchestration-registry.json"),
              Path("claude/skills/information-accessibility-practice/references/orchestration-registry.json"),
              Path("codex/skills/information-accessibility-practice/scripts/lib/audit-run.mjs"),
              Path("claude/skills/information-accessibility-practice/scripts/lib/audit-run.mjs"),
              Path("tests/audit-orchestration-contract.test.mjs"),
          ]
          for path in schema_paths:
              text = path.read_text()
              if text.count(old_pattern) != 1:
                  raise SystemExit(f"Unexpected schema shape: {path}")
              path.write_text(text.replace(old_pattern, new_pattern, 1))
          for path in hash_paths:
              text = path.read_text()
              if text.count(old_hash) != 1:
                  raise SystemExit(f"Unexpected schema-hash contract shape: {path}")
              path.write_text(text.replace(old_hash, new_hash, 1))
          PYCODE
      - name: Add regression test
        shell: bash
        run: |
          cat > tests/additional-wcag-screening-id.test.mjs <<'TEST'
          import assert from "node:assert/strict";
          import crypto from "node:crypto";
          import fs from "node:fs";
          import path from "node:path";
          import test from "node:test";
          import { fileURLToPath } from "node:url";

          import { loadAuditResources } from "../codex/skills/information-accessibility-practice/scripts/lib/audit-run.mjs";
          import { validateJsonSchema } from "../codex/skills/information-accessibility-practice/scripts/lib/json-schema.mjs";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const skill = path.join(root, "codex/skills/information-accessibility-practice");
          const schemaPath = path.join(skill, "references/screening-observations.schema.json");
          const schemaBytes = fs.readFileSync(schemaPath);
          const schema = JSON.parse(schemaBytes.toString("utf8"));

          function payload(profileRequirementId) {
            return {
              schema_version: "2.0.0",
              observations: [{
                requirement_id: "SCREEN-ADDITIONAL-FOCUS",
                evidence_level: "E1",
                method: "browser inspection",
                location: "https://example.invalid/",
                observation: "The focus indicator was obscured.",
                captured_at: "2026-08-21T00:00:00Z",
                profile_requirement_id: profileRequirementId,
                report_outcome: "fail",
                applicability: "applicable",
                report_rationale: "The visible focus indicator was obscured."
              }]
            };
          }

          test("screening schema accepts additional WCAG requirements registered by jp-public-web", () => {
            const errors = [];
            validateJsonSchema(payload("WCAG-2.2-ADDITIONAL-SC-2.4.11"), schema, "$", errors);
            assert.deepEqual(errors, []);

            const invalidErrors = [];
            validateJsonSchema(payload("WCAG-2.2-OTHER-SC-2.4.11"), schema, "$", invalidErrors);
            assert.ok(invalidErrors.some((error) => error.includes("profile_requirement_id")));
          });

          test("screening schema hash remains synchronized with the runtime manifest", () => {
            const resources = loadAuditResources(skill);
            const manifest = resources.orchestrationRegistry.artifact_types
              .find((artifactType) => artifactType.id === "screening-observations");
            const current = manifest.schema_versions.find((entry) => entry.mode === "current");
            const normalized = Buffer.from(schemaBytes.toString("utf8").replace(/\r\n/gu, "\n"), "utf8");
            assert.equal(crypto.createHash("sha256").update(normalized).digest("hex"), current.schema_sha256);
          });
          TEST
      - name: Run focused regression test
        run: node --test tests/additional-wcag-screening-id.test.mjs
      - name: Run package verification
        run: node scripts/verify-package.mjs
      - name: Run full Node suite and require only the known Linux path-message failure
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > /tmp/all-tests.log 2>&1
          status=$?
          set -e
          cat /tmp/all-tests.log
          test "$status" -eq 1
          python - <<'PYCODE'
          from pathlib import Path

          lines = Path("/tmp/all-tests.log").read_text().splitlines()
          allowed_fragments = [
              "validate-fix-authorization CLI rejects invalid target paths",
              "tests/authorized-fixer.test.mjs",
          ]
          unexpected = [
              line for line in lines
              if line.startswith("not ok ")
              and not any(fragment in line for fragment in allowed_fragments)
          ]
          if unexpected:
              raise SystemExit("Unexpected test failures:\n" + "\n".join(unexpected))
          if not any("validate-fix-authorization CLI rejects invalid target paths" in line for line in lines):
              raise SystemExit("Known Linux-specific failing test was not present")
          if not any("target file path must not contain ':'" in line for line in lines):
              raise SystemExit("Known Linux-specific assertion message changed")
          PYCODE
      - name: Check generated criteria catalog
        run: node scripts/build-criteria-catalog.mjs --check
      - name: Commit verified changes
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue24.yml .github/workflows/repair-issue24.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            codex/skills/information-accessibility-practice/references/screening-observations.schema.json \
            claude/skills/information-accessibility-practice/references/screening-observations.schema.json \
            codex/skills/information-accessibility-practice/references/orchestration-registry.json \
            claude/skills/information-accessibility-practice/references/orchestration-registry.json \
            codex/skills/information-accessibility-practice/scripts/lib/audit-run.mjs \
            claude/skills/information-accessibility-practice/scripts/lib/audit-run.mjs \
            tests/audit-orchestration-contract.test.mjs \
            tests/additional-wcag-screening-id.test.mjs \
            .github/workflows/one-shot-issue24.yml \
            .github/workflows/repair-issue24.yml
          git commit -m "fix: accept additional WCAG screening mappings"
          git push origin HEAD:fix/issue-24-additional-wcag-screening-id
