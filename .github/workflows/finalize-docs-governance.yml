name: Finalize docs governance
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'integration/docs-governance-slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/docs-governance-slice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Connect README entry points
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          inserts = {
            "README.md": ("## 使い方を選ぶ\n", """## 使い方を選ぶ\n\n> 初めて使う場合は **[5分で試すガイド](docs/getting-started.md)** から始めてください。仕組み全体は **[アーキテクチャと用語集](docs/architecture-and-glossary.md)** にまとめています。\n\n"""),
            "README.en.md": ("## Choose a usage path\n", """## Choose a usage path\n\n> New here? Start with the **[five-minute getting-started guide](docs/getting-started.md)**. The full workflow is explained in **[Architecture and glossary](docs/architecture-and-glossary.md)**.\n\n""")
          }
          for filename, (marker, replacement) in inserts.items():
              p = Path(filename)
              text = p.read_text()
              if "docs/getting-started.md" not in text:
                  if marker not in text: raise SystemExit(f"missing README marker: {filename}")
                  text = text.replace(marker, replacement, 1)
              footer = """\n## Project documentation\n\n- [Security policy](SECURITY.md)\n- [Contributing](CONTRIBUTING.md)\n- [Changelog](CHANGELOG.md)\n- [Third-party notices](THIRD_PARTY_NOTICES.md)\n"""
              if "THIRD_PARTY_NOTICES.md" not in text:
                  text = text.rstrip() + "\n" + footer
              p.write_text(text)

          Path("tests/docs-governance.test.mjs").write_text(r'''import assert from "node:assert/strict";
import fs from "node:fs";
import test from "node:test";
for (const file of ["README.md", "README.en.md"]) {
  test(`${file} links onboarding and governance docs`, () => {
    const text = fs.readFileSync(file, "utf8");
    for (const target of ["docs/getting-started.md", "docs/architecture-and-glossary.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md"]) assert.match(text, new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")));
  });
}
''')
          PY
      - name: Verify
        run: |
          node --test tests/architecture-doc.test.mjs tests/docs-governance.test.mjs
          node scripts/verify-all.mjs
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/finalize-docs-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: connect onboarding and governance entry points"
          git push origin HEAD:integration/docs-governance-slice
