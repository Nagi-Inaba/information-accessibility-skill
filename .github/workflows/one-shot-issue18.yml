name: Finalize issue 18
on:
  push:
    branches: [fix/issue-18-profile-report-title]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-18-profile-report-title
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make report titles profile-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for base in ["codex", "claude"]:
            path = Path(base) / "skills/information-accessibility-practice/scripts/render-audit-report.mjs"
            text = path.read_text()
            marker = 'export function reportJudgementForOutcome(outcome) {'
            helper = '''export function reportTitleForProfile(profileId) {\n  return profileId === "jp-public-web"\n    ? "# JIS X 8341-3:2016＋追加WCAG検査レポート"\n    : "# WCAG検査レポート";\n}\n\n'''
            if marker not in text: raise SystemExit(f"renderer marker missing: {path}")
            text = text.replace(marker, helper + marker, 1)
            if text.count('    "# WCAG検査レポート",') < 2: raise SystemExit(f"report title markers missing: {path}")
            text = text.replace('    "# WCAG検査レポート",', '    reportTitleForProfile(assessment.profile.id),', 1)
            text = text.replace('    "# WCAG検査レポート",', '    reportTitleForProfile(model.profile.id),', 1)
            path.write_text(text)

          Path("tests/profile-report-title.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import test from "node:test";
          import { generateAssessment } from "../codex/skills/information-accessibility-practice/scripts/generate-assessment.mjs";
          import { validateAssessment } from "../codex/skills/information-accessibility-practice/scripts/validate-assessment.mjs";
          import { renderAuditReport, reportTitleForProfile } from "../codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs";

          const skill = path.resolve("codex/skills/information-accessibility-practice");
          const read = (name) => JSON.parse(fs.readFileSync(path.join(skill, "references", name), "utf8"));

          test("profile report title distinguishes JIS plus additional WCAG from WCAG-only review", () => {
            assert.equal(reportTitleForProfile("web-modern"), "# WCAG検査レポート");
            assert.equal(reportTitleForProfile("jp-public-web"), "# JIS X 8341-3:2016＋追加WCAG検査レポート");
          });

          test("standalone jp-public-web report uses the JIS-aware title and keeps group counts", () => {
            const record = generateAssessment("jp-public-web", {
              targetName: "Example Japan site",
              targetVersion: "v1",
              targetRefs: ["https://example.invalid/"],
              evaluator: "Reviewer",
              evaluatedAt: "2026-08-22"
            });
            const validation = validateAssessment(record, read("standards-registry.json"), read("assessment-record.schema.json"), read("criteria-catalog.json"), read("web-audit-methods.json"));
            assert.equal(validation.valid, true, validation.errors.join("; "));
            const report = renderAuditReport(record, validation);
            assert.match(report, /^# JIS X 8341-3:2016＋追加WCAG検査レポート/mu);
            assert.match(report, /達成基準の区分別件数/u);
            assert.match(report, /JIS/u);
          });
          ''')
          PY
      - name: Verify
        run: |
          node --test tests/profile-report-title.test.mjs tests/audit-report.test.mjs
          node scripts/verify-package.mjs
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue18.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs claude/skills/information-accessibility-practice/scripts/render-audit-report.mjs tests/profile-report-title.test.mjs .github/workflows/one-shot-issue18.yml
          git commit -m "fix: make audit report titles profile-aware"
          git push origin HEAD:fix/issue-18-profile-report-title
