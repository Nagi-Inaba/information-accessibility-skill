name: Verify issue 28 run migration planning

on:
  push:
    branches: [feat/issue-28-run-migration-plan]

permissions:
  contents: write

concurrency:
  group: next20-issue-28
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-28-run-migration-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove the regression test fails without the implementation
        shell: bash
        run: |
          set -euo pipefail
          mv codex/skills/information-accessibility-practice/scripts/lib/audit-run-migration.mjs /tmp/codex-run-migration.mjs
          mv claude/skills/information-accessibility-practice/scripts/lib/audit-run-migration.mjs /tmp/claude-run-migration.mjs
          if node --test tests/audit-run-migration.test.mjs; then
            echo 'Expected the focused test to fail without the implementation.' >&2
            exit 1
          fi
          mv /tmp/codex-run-migration.mjs codex/skills/information-accessibility-practice/scripts/lib/audit-run-migration.mjs
          mv /tmp/claude-run-migration.mjs claude/skills/information-accessibility-practice/scripts/lib/audit-run-migration.mjs
      - name: Verify focused behavior and package parity
        run: |
          node --test tests/audit-run-migration.test.mjs
          node scripts/verify-package.mjs
          node scripts/build-criteria-catalog.mjs --check
      - name: Remove one-shot workflow after successful verification
        shell: bash
        run: |
          rm .github/workflows/one-shot-next20-28.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/one-shot-next20-28.yml
          git commit -m "ci: remove issue 28 one-shot verifier"
          git push origin HEAD:feat/issue-28-run-migration-plan
