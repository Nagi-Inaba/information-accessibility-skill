name: Finalize issue 23
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-23-report-claim-range
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add claim range to reports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          old1='''    `- 適用対象外件数: ${count(profileCounts, "not_applicable")}`,\n    "",\n    "## 2. 検査対象",'''
          new1='''    `- 適用対象外件数: ${count(profileCounts, "not_applicable")}`,\n    "",\n    "### 表明可能な範囲",\n    "",\n    `- 要求した表明レベル: ${cell(assessment.claim.requested_tier)}`,\n    `- 証拠から許される上限: ${cell(guard.max_tier)}`,\n    `- 表明文: ${cell(assessment.claim.proposed_wording)}`,\n    "",\n    "## 2. 検査対象",'''
          old2='''    `- 適用対象外: ${notApplicableChecks.length}`,\n    "",\n    "## 2. 検査対象",'''
          new2='''    `- 適用対象外: ${notApplicableChecks.length}`,\n    "",\n    "### 表明可能な範囲",\n    "",\n    `- 表明レベル: ${cell(model.claim.tier)}`,\n    `- 表明文: ${cell(model.claim.wording)}`,\n    "",\n    "## 2. 検査対象",'''
          for base in ['codex','claude']:
            p=Path(base)/'skills/information-accessibility-practice/scripts/render-audit-report.mjs'
            t=p.read_text()
            if old1 not in t or old2 not in t: raise SystemExit(f'unexpected report shape: {p}')
            p.write_text(t.replace(old1,new1,1).replace(old2,new2,1))
          p=Path('tests/audit-report.test.mjs'); t=p.read_text()
          marker='test("report judgement vocabulary and overall priority are fixed", () => {'
          test='''test("standalone report exposes the requested and guarded claim range", () => {\n  const record = reviewedRecord();\n  const validation = validate(record);\n  assert.equal(validation.valid, true);\n  const report = renderAuditReport(record, validation);\n  assert.match(report, /### 表明可能な範囲/);\n  assert.match(report, /要求した表明レベル:/);\n  assert.match(report, /証拠から許される上限:/);\n});\n\n'''
          if test not in t:
            if marker not in t: raise SystemExit('test marker missing')
            t=t.replace('  renderRunBackedReport\n} from', '  renderRunBackedReport,\n  renderAuditReport\n} from') if 'renderAuditReport' not in t.split('} from')[0] else t
            p.write_text(t.replace(marker,test+marker,1))
          PY
      - name: Verify
        run: |
          node --test tests/audit-report.test.mjs
          node scripts/verify-package.mjs
      - name: Commit
        run: |
          rm .github/workflows/one-shot-issue23.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs claude/skills/information-accessibility-practice/scripts/render-audit-report.mjs tests/audit-report.test.mjs .github/workflows/one-shot-issue23.yml
          git commit -m "feat: show claim range in audit reports"
          git push origin HEAD:fix/issue-23-report-claim-range