name: Finalize issue 11

on:
  push:
    branches: [feat/issue-11-init-scope-environment]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-11-init-scope-environment
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add init configuration support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config_schema = r'''{
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "$id": "https://example.invalid/information-accessibility/audit-init-config.schema.json",
            "title": "Audit initialization scope and environment",
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "scope": {
                "type": "object",
                "additionalProperties": false,
                "required": ["included", "excluded", "complete_processes", "third_party_content", "full_pages_reviewed"],
                "properties": {
                  "included": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "excluded": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "complete_processes": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "third_party_content": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "full_pages_reviewed": { "type": "boolean" }
                }
              },
              "environment": {
                "type": "object",
                "additionalProperties": false,
                "required": ["os", "browsers", "assistive_technologies", "input_modes"],
                "properties": {
                  "os": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "browsers": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "assistive_technologies": { "type": "array", "items": { "type": "string", "minLength": 1 } },
                  "input_modes": { "type": "array", "items": { "type": "string", "minLength": 1 } }
                }
              }
            }
          }
          '''

          for base in ["codex", "claude"]:
              root = Path(base) / "skills/information-accessibility-practice"
              (root / "references/audit-init-config.schema.json").write_text(config_schema)

              cli = root / "scripts/create-audit-run.mjs"
              text = cli.read_text()
              text = text.replace('import { pathToFileURL } from "node:url";', 'import { fileURLToPath, pathToFileURL } from "node:url";')
              import_marker = 'import { assertNewOutputPath, assertStableFile, createAuditRun, readStableFile, writeNewJson } from "./lib/audit-run.mjs";\n'
              validation_import = 'import { validateJsonSchema } from "./lib/json-schema.mjs";\n'
              if validation_import not in text:
                  if text.count(import_marker) != 1:
                      raise SystemExit(f"create-run import marker missing: {cli}")
                  text = text.replace(import_marker, import_marker + validation_import, 1)

              text = text.replace('  const optional = new Set(["--supersedes-run"]);', '  const optional = new Set(["--supersedes-run", "--config"]);')
              compact_map = '    ["--interaction", "interaction"], ["--source-write", "sourceWrite"], ["--supersedes-run", "supersedesRunFile"], ["--output", "output"]\n'
              compact_map_new = '    ["--interaction", "interaction"], ["--source-write", "sourceWrite"], ["--supersedes-run", "supersedesRunFile"], ["--config", "configFile"], ["--output", "output"]\n'
              if compact_map_new not in text:
                  if text.count(compact_map) != 1:
                      raise SystemExit(f"create-run compact argument map missing: {cli}")
                  text = text.replace(compact_map, compact_map_new, 1)

              config_block = '''  let config;
              let configSnapshot;
              if (options.configFile) {
                configSnapshot = readStableFile(options.configFile, { label: "audit initialization config" });
                try {
                  config = JSON.parse(configSnapshot.bytes.toString("utf8").replace(/^\\uFEFF/u, ""));
                } catch (error) {
                  throw new Error(`Invalid JSON in audit initialization config: ${error.message}`);
                }
                const schemaPath = path.join(path.dirname(path.dirname(fileURLToPath(import.meta.url))), "references", "audit-init-config.schema.json");
                const schemaSnapshot = readStableFile(schemaPath, { label: "audit initialization config schema" });
                const schema = JSON.parse(schemaSnapshot.bytes.toString("utf8"));
                const errors = [];
                validateJsonSchema(config, schema, "$", errors);
                if (errors.length > 0) throw new Error(`Invalid audit initialization config:\\n- ${errors.join("\\n- ")}`);
                if (!config.scope && !config.environment) throw new Error("Audit initialization config must contain scope or environment.");
              }
              '''
              predecessor_marker = '  let predecessor;\n'
              if config_block not in text:
                  if text.count(predecessor_marker) != 1:
                      raise SystemExit(f"predecessor marker missing: {cli}")
                  text = text.replace(predecessor_marker, config_block + predecessor_marker, 1)

              call_block = '''    supersedesRun: predecessor?.value,
                supersedesRunFile: predecessor?.snapshot.path
              });'''
              call_block_new = '''    supersedesRun: predecessor?.value,
                supersedesRunFile: predecessor?.snapshot.path,
                scope: config?.scope,
                environment: config?.environment
              });'''
              if call_block_new not in text:
                  if text.count(call_block) != 1:
                      raise SystemExit(f"create-run call block missing: {cli}")
                  text = text.replace(call_block, call_block_new, 1)

              stable_marker = '  if (predecessor) assertStableFile(predecessor.snapshot, "superseded audit run");\n'
              config_stable = '  if (configSnapshot) assertStableFile(configSnapshot, "audit initialization config");\n'
              if config_stable not in text:
                  if text.count(stable_marker) != 1:
                      raise SystemExit(f"stable marker missing: {cli}")
                  text = text.replace(stable_marker, stable_marker + config_stable, 1)
              cli.write_text(text)

              library = root / "scripts/lib/audit-run.mjs"
              text = library.read_text()
              old_scope = '''    scope: { included: targetRefs, excluded: [], complete_processes: [], third_party_content: [], full_pages_reviewed: false },
                environment: { os: ["not_declared"], browsers: [], assistive_technologies: [], input_modes: [] },'''
              new_scope = '''    scope: structuredClone(options.scope ?? options.supersedesRun?.scope ?? { included: targetRefs, excluded: [], complete_processes: [], third_party_content: [], full_pages_reviewed: false }),
                environment: structuredClone(options.environment ?? options.supersedesRun?.environment ?? { os: ["not_declared"], browsers: [], assistive_technologies: [], input_modes: [] }),'''
              if new_scope not in text:
                  if text.count(old_scope) != 1:
                      raise SystemExit(f"default scope/environment block missing: {library}")
                  text = text.replace(old_scope, new_scope, 1)
              old_limit = '    limitations: ["The environment was not declared; no profile outcome has been recorded."]'
              new_limit = '    limitations: options.environment ? ["No profile outcome has been recorded."] : ["The environment was not declared; no profile outcome has been recorded."]'
              if new_limit not in text:
                  if text.count(old_limit) != 1:
                      raise SystemExit(f"limitation block missing: {library}")
                  text = text.replace(old_limit, new_limit, 1)
              library.write_text(text)

          Path("tests/audit-init-config.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          import test from "node:test";
          import { fileURLToPath } from "node:url";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const script = path.join(root, "codex/skills/information-accessibility-practice/scripts/create-audit-run.mjs");

          function args(temp, configPath, output, runId) {
            return [script, "--run-id", runId, "--profile", "web-modern", "--target-name", "Example", "--target-version", "v1", "--target-ref", "https://example.invalid/checkout", "--artifact-root", path.join(temp, "artifacts"), "--network", "denied", "--interaction", "read_only", "--source-write", "denied", "--config", configPath, "--output", output];
          }

          test("audit init records declared scope and environment from a validated config", () => {
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), "audit-config-"));
            fs.mkdirSync(path.join(temp, "artifacts"));
            const configPath = path.join(temp, "config.json");
            const output = path.join(temp, "run.json");
            const config = {
              scope: { included: ["Checkout page"], excluded: ["Payment provider iframe"], complete_processes: ["Complete checkout"], third_party_content: ["Payment provider iframe"], full_pages_reviewed: true },
              environment: { os: ["Windows 11"], browsers: ["Chrome 140"], assistive_technologies: ["NVDA 2026.2"], input_modes: ["keyboard"] }
            };
            fs.writeFileSync(configPath, JSON.stringify(config));
            const result = spawnSync(process.execPath, args(temp, configPath, output, "RUN-20260822T000000Z-CONFIG01"), { encoding: "utf8" });
            assert.equal(result.status, 0, result.stderr);
            const run = JSON.parse(fs.readFileSync(output, "utf8"));
            assert.deepEqual(run.scope, config.scope);
            assert.deepEqual(run.environment, config.environment);
            assert.deepEqual(run.limitations, ["No profile outcome has been recorded."]);
          });

          test("audit init rejects malformed config before creating a run", () => {
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), "audit-bad-config-"));
            fs.mkdirSync(path.join(temp, "artifacts"));
            const configPath = path.join(temp, "config.json");
            const output = path.join(temp, "run.json");
            fs.writeFileSync(configPath, JSON.stringify({ environment: { os: "Windows" } }));
            const result = spawnSync(process.execPath, args(temp, configPath, output, "RUN-20260822T000000Z-CONFIG02"), { encoding: "utf8" });
            assert.notEqual(result.status, 0);
            assert.match(result.stderr, /Invalid audit initialization config/);
            assert.equal(fs.existsSync(output), false);
          });
          ''')
          PY
      - name: Verify
        run: |
          node --test tests/audit-init-config.test.mjs tests/audit-orchestration-cli.test.mjs
          node scripts/verify-package.mjs
          node scripts/build-criteria-catalog.mjs --check
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/references/audit-init-config.schema.json claude/skills/information-accessibility-practice/references/audit-init-config.schema.json codex/skills/information-accessibility-practice/scripts/create-audit-run.mjs claude/skills/information-accessibility-practice/scripts/create-audit-run.mjs codex/skills/information-accessibility-practice/scripts/lib/audit-run.mjs claude/skills/information-accessibility-practice/scripts/lib/audit-run.mjs tests/audit-init-config.test.mjs .github/workflows/one-shot-issue11.yml
          git commit -m "feat: declare audit scope and environment at initialization"
          git push origin HEAD:feat/issue-11-init-scope-environment
