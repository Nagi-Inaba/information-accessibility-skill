name: Accessible report E2E

on:
  pull_request:
    paths:
      - "codex/skills/information-accessibility-practice/scripts/render-report.mjs"
      - "claude/skills/information-accessibility-practice/scripts/render-report.mjs"
      - "codex/skills/information-accessibility-practice/scripts/lib/report-*.mjs"
      - "claude/skills/information-accessibility-practice/scripts/lib/report-*.mjs"
      - "tests/accessible-html-*.test.mjs"
      - ".github/workflows/report-accessibility-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install exact report verification dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.13.0
      - name: Install Chromium
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: Verify generated Japanese and English HTML reports
        env:
          RUN_ACCESSIBLE_HTML_BROWSER_E2E: "1"
          REPORT_BROWSER_E2E_OUTPUT: audit-runs/report-accessibility/browser-e2e.json
        run: |
          mkdir -p audit-runs/report-accessibility
          node --test tests/accessible-html-browser-e2e.test.mjs
          node scripts/verify-package.mjs
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: accessible-report-browser-evidence
          path: audit-runs/report-accessibility/browser-e2e.json
          if-no-files-found: error
          retention-days: 14
