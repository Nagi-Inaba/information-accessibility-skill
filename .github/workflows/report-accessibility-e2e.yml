name: Accessible report E2E

on:
  pull_request:
    paths:
      - "shared/skill/scripts/render-report.mjs"
      - "shared/skill/scripts/lib/report-*.mjs"
      - "tests/accessible-html-*.test.mjs"
      - ".github/workflows/report-accessibility-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Generate Codex and Claude skills
        run: node scripts/sync-distributions.mjs --write
      - name: Install exact report verification dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.13.0
      - name: Install Chromium
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: Verify generated Japanese and English HTML reports
        env:
          RUN_ACCESSIBLE_HTML_BROWSER_E2E: "1"
          REPORT_BROWSER_E2E_OUTPUT: audit-runs/report-accessibility/browser-e2e.json
        run: |
          mkdir -p audit-runs/report-accessibility
          node --test tests/accessible-html-browser-e2e.test.mjs
          node scripts/verify-package.mjs
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessible-report-browser-evidence
          path: audit-runs/report-accessibility/browser-e2e.json
          if-no-files-found: error
          retention-days: 14
