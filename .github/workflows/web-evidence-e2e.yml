name: Web evidence E2E

on:
  pull_request:
    paths:
      - "codex/skills/information-accessibility-practice/scripts/capture-web-evidence.mjs"
      - "claude/skills/information-accessibility-practice/scripts/capture-web-evidence.mjs"
      - "codex/skills/information-accessibility-practice/scripts/scan-web.mjs"
      - "claude/skills/information-accessibility-practice/scripts/scan-web.mjs"
      - "codex/skills/information-accessibility-practice/scripts/lib/automated-web-scan.mjs"
      - "claude/skills/information-accessibility-practice/scripts/lib/automated-web-scan.mjs"
      - "tests/web-evidence-*.test.mjs"
      - "tests/scan-web-e2e.test.mjs"
      - "examples/web-e2e/**"
      - ".github/workflows/web-evidence-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install exact browser scan dependencies
        run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.13.0
      - name: Install Chromium
        run: npx playwright@1.62.1 install --with-deps chromium
      - name: Run policy and browser E2E tests
        env:
          RUN_SCAN_WEB_E2E: "1"
        run: |
          node --test tests/web-evidence-adapter.test.mjs tests/web-evidence-e2e.test.mjs tests/scan-web-e2e.test.mjs
          node scripts/verify-package.mjs
