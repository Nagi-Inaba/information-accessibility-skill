name: Finalize issue 14 procedure batch

on:
  push:
    branches: [feat/issue-14-procedure-batch-focus-errors]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-14-procedure-batch-focus-errors
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add high-impact criterion procedures
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ai_boundary = "AI may inventory candidate states, affected elements, or draft review questions, but it must not record a profile outcome, human_verified mapping, or E2+ claim; an external human reviewer records any criterion result with target-specific evidence."
          procedures = [
            {
              "id": "wcag22-sc-2-4-7-focus-visible",
              "requirement_id": "WCAG-2.2-SC-2.4.7",
              "procedure_version": "1.0.0",
              "procedure_kind": "human_manual_or_hybrid",
              "automation_role": "supporting_only",
              "primary_sources": [
                "https://www.w3.org/TR/WCAG22/#focus-visible",
                "https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html"
              ],
              "applicability_steps": [
                "Inventory every keyboard-operable user interface component in the fixed scope, including components revealed only after permitted interaction.",
                "Record the states and viewport conditions needed to reach each component and identify any component whose focus state cannot be observed."
              ],
              "procedure_steps": [
                "Starting from a known location, move focus through each applicable component using only the documented keyboard interface and record the exact focus sequence.",
                "At each stop, compare the focused state with the unfocused state and record the visible indicator, its location, and whether it remains perceptible against adjacent colors and content.",
                "Repeat the observation in required component states, overlays, and responsive variants where the focus presentation changes.",
                "Record focus-order, keyboard-operability, or obscuration problems separately under their corresponding criteria rather than treating a visible indicator as evidence for those requirements."
              ],
              "expected_results": [
                "Each keyboard-operable component exposes a visually discernible focus indicator whenever it receives keyboard focus.",
                "The recorded indicator can be distinguished from the same component's unfocused presentation in each reviewed state."
              ],
              "required_evidence_types": ["keyboard_test", "manual_observation"],
              "cant_tell_when": [
                "The component cannot be focused through the permitted keyboard path or its focused and unfocused visual states cannot be compared.",
                "A transient overlay, animation, or inaccessible state prevents a stable observation of the focus indicator."
              ],
              "counterexamples": {
                "pass": ["A link receives a persistent outline that is clearly visible against the surrounding background throughout keyboard navigation."],
                "fail": ["A custom button receives keyboard focus, but its focused appearance is visually identical to its unfocused appearance."],
                "cant_tell": ["Focus is reported programmatically, but the reviewer cannot capture or observe the rendered focused state in the permitted viewport."]
              },
              "ai_boundary": ai_boundary
            },
            {
              "id": "wcag22-sc-2-4-11-focus-not-obscured-minimum",
              "requirement_id": "WCAG-2.2-SC-2.4.11",
              "procedure_version": "1.0.0",
              "procedure_kind": "human_manual_or_hybrid",
              "automation_role": "supporting_only",
              "primary_sources": [
                "https://www.w3.org/TR/WCAG22/#focus-not-obscured-minimum",
                "https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html"
              ],
              "applicability_steps": [
                "Identify keyboard-focusable components in the fixed scope and every permitted state in which sticky headers, dialogs, popovers, cookie notices, or other author-created content may overlap them.",
                "Record the viewport, zoom, responsive layout, and scroll position needed to reproduce each possible overlap."
              ],
              "procedure_steps": [
                "Navigate to each applicable component by keyboard and allow any automatic scrolling or author-controlled positioning to complete.",
                "Inspect the focused component and determine whether any portion of it is hidden by author-created content in the reviewed state.",
                "Repeat the test while opening and closing applicable overlays and at the named responsive or zoom conditions that alter fixed-position content.",
                "Record the obscuring content, the hidden portion, the focus path, and whether the user can reveal the component without moving focus away."
              ],
              "expected_results": [
                "When a component receives keyboard focus, the component is not entirely hidden by author-created content.",
                "Any claimed exception or user-movable overlay is identified and tested in the exact state where the overlap occurs."
              ],
              "required_evidence_types": ["keyboard_test", "browser_inspection"],
              "cant_tell_when": [
                "The required focus state or overlay cannot be reproduced in the permitted environment.",
                "The reviewer cannot distinguish author-created overlap from browser or operating-system chrome outside the reviewed content."
              ],
              "counterexamples": {
                "pass": ["Keyboard focus moves to a field below a sticky header and the page positions the full field below the header."],
                "fail": ["A cookie banner completely covers the focused submit button and the button cannot be revealed without changing focus."],
                "cant_tell": ["A recording suggests an overlap, but the viewport, scroll position, and focused element cannot be reproduced."]
              },
              "ai_boundary": ai_boundary
            },
            {
              "id": "wcag22-sc-3-3-1-error-identification",
              "requirement_id": "WCAG-2.2-SC-3.3.1",
              "procedure_version": "1.0.0",
              "procedure_kind": "human_manual_or_hybrid",
              "automation_role": "supporting_only",
              "primary_sources": [
                "https://www.w3.org/TR/WCAG22/#error-identification",
                "https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html"
              ],
              "applicability_steps": [
                "Inventory user inputs and transactions in the fixed scope that can produce automatically detected validation or processing errors.",
                "Define safe invalid or incomplete inputs for each applicable path without causing an unauthorized external side effect."
              ],
              "procedure_steps": [
                "Submit or advance each applicable path with the defined invalid input and record the input, action, and resulting state.",
                "Identify every automatically detected error and inspect the text, programmatic association, and location used to identify the affected item.",
                "Confirm that the error is described in text rather than communicated only through color, iconography, position, or sound.",
                "Repeat the test for errors that appear after client-side validation, server response, or a changed step, and record unresolved cases separately."
              ],
              "expected_results": [
                "Each automatically detected input error is identified and described in text for the affected item.",
                "The error information remains available in the resulting state long enough for the user to find and understand it."
              ],
              "required_evidence_types": ["browser_inspection", "manual_observation"],
              "cant_tell_when": [
                "The invalid state cannot be safely triggered or the resulting error content cannot be inspected.",
                "A third-party or server-controlled failure prevents the reviewer from determining whether the application detected and identified the user's input error."
              ],
              "counterexamples": {
                "pass": ["After submission, the page states that the email address is invalid and associates the message with the email field."],
                "fail": ["An invalid field is marked only with a red border and no text identifies or describes the error."],
                "cant_tell": ["The form cannot be submitted in the test environment, so the automatically detected error state is unavailable."]
              },
              "ai_boundary": ai_boundary
            },
            {
              "id": "wcag22-sc-4-1-3-status-messages",
              "requirement_id": "WCAG-2.2-SC-4.1.3",
              "procedure_version": "1.0.0",
              "procedure_kind": "human_manual_or_hybrid",
              "automation_role": "supporting_only",
              "primary_sources": [
                "https://www.w3.org/TR/WCAG22/#status-messages",
                "https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html"
              ],
              "applicability_steps": [
                "Inventory changes in the fixed scope that present success, error, progress, loading, result-count, cart, or other status information without moving focus to that information.",
                "Record the interaction and state required to trigger each message and distinguish status information from content that intentionally receives focus."
              ],
              "procedure_steps": [
                "Trigger each applicable status change while monitoring the DOM, accessibility tree, and assistive-technology output without moving focus manually to the message.",
                "Record the message content, the programmatic role or live-region mechanism, the focus position before and after the change, and the announcement observed.",
                "Verify that the status purpose and message are exposed through an appropriate role or property so assistive technology can present the change without an additional focus move.",
                "Repeat the observation for successive updates, delayed responses, and error or progress variants to detect messages that are announced only on the first change or not announced at all."
              ],
              "expected_results": [
                "Applicable status messages are programmatically exposed so assistive technology can present them without receiving focus.",
                "The exposed status communicates the same relevant success, error, progress, or result information shown visually in the reviewed state."
              ],
              "required_evidence_types": ["browser_inspection", "assistive_technology_test"],
              "cant_tell_when": [
                "The dynamic status cannot be triggered or the accessibility-tree and assistive-technology response cannot be observed.",
                "The reviewer cannot determine whether the content is a status message or content intended to receive focus under another interaction pattern."
              ],
              "counterexamples": {
                "pass": ["After adding an item, a live status announces the updated cart count while focus remains on the add button."],
                "fail": ["A visual 'Saved' message appears without focus change, but no role, live-region update, or assistive-technology announcement is exposed."],
                "cant_tell": ["The DOM update is visible in a static capture, but no assistive-technology runtime is available to observe notification behavior."]
              },
              "ai_boundary": ai_boundary
            }
          ]

          for base in ["codex", "claude"]:
              path = Path(base) / "skills/information-accessibility-practice/references/criterion-procedures.json"
              data = json.loads(path.read_text())
              by_id = {item["id"]: item for item in data["procedures"]}
              for item in procedures:
                  by_id.setdefault(item["id"], item)
              existing_order = [item["id"] for item in data["procedures"]]
              additions = [item["id"] for item in procedures if item["id"] not in existing_order]
              data["procedures"] = [by_id[item_id] for item_id in existing_order + additions]
              data["verified_at"] = "2026-08-22"
              data["usage_rule"] = "Use a listed procedure only after fixing the target scope and opening its primary sources. This partial catalog adds procedures for eight high-priority criteria only; it does not make an unlisted criterion executable or the profile complete."
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")

          Path("tests/criterion-procedure-batch.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import test from "node:test";
          import { lookupRequirement } from "../codex/skills/information-accessibility-practice/scripts/show-requirement.mjs";
          import { validateJsonSchema } from "../codex/skills/information-accessibility-practice/scripts/lib/json-schema.mjs";

          const procedures = JSON.parse(fs.readFileSync("codex/skills/information-accessibility-practice/references/criterion-procedures.json", "utf8"));
          const schema = JSON.parse(fs.readFileSync("codex/skills/information-accessibility-practice/references/criterion-procedures.schema.json", "utf8"));
          const added = [
            "WCAG-2.2-SC-2.4.7",
            "WCAG-2.2-SC-2.4.11",
            "WCAG-2.2-SC-3.3.1",
            "WCAG-2.2-SC-4.1.3"
          ];

          test("expanded procedure catalog remains schema-valid and partial", () => {
            const errors = [];
            validateJsonSchema(procedures, schema, "$", errors);
            assert.deepEqual(errors, []);
            assert.equal(procedures.catalog_status, "partial");
            assert.equal(procedures.procedures.length, 8);
            assert.match(procedures.usage_rule, /eight high-priority criteria/u);
          });

          test("focus, error, and status-message criteria expose complete human procedures", () => {
            for (const requirementId of added) {
              const lookup = lookupRequirement("web-modern", requirementId);
              assert.equal(lookup.criterion_procedure_status, "available", requirementId);
              const procedure = lookup.criterion_procedure;
              assert.ok(procedure.applicability_steps.length >= 2, requirementId);
              assert.ok(procedure.procedure_steps.length >= 3, requirementId);
              assert.ok(procedure.expected_results.length >= 2, requirementId);
              assert.ok(procedure.required_evidence_types.length >= 2, requirementId);
              assert.ok(procedure.cant_tell_when.length >= 1, requirementId);
              for (const outcome of ["pass", "fail", "cant_tell"]) assert.ok(procedure.counterexamples[outcome].length >= 1, `${requirementId}:${outcome}`);
            }
          });

          test("unimplemented criteria still remain explicitly unavailable", () => {
            const lookup = lookupRequirement("web-modern", "WCAG-2.2-SC-1.2.1");
            assert.equal(lookup.criterion_procedure_status, "not_available");
            assert.equal(lookup.procedure_binding.procedure_availability, "unavailable");
          });
          ''')
          PY
      - name: Verify
        shell: bash
        run: |
          node --test tests/criterion-procedure-batch.test.mjs tests/audit-workflow.test.mjs tests/audit-orchestration-cli.test.mjs
          node scripts/verify-package.mjs
          node scripts/build-criteria-catalog.mjs --check
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/references/criterion-procedures.json claude/skills/information-accessibility-practice/references/criterion-procedures.json tests/criterion-procedure-batch.test.mjs .github/workflows/one-shot-issue14.yml
          git commit -m "feat: add focus error and status criterion procedures"
          git push origin HEAD:feat/issue-14-procedure-batch-focus-errors
