name: Finalize issue 34

on:
  push:
    branches: [fix/issue-34-safe-output-parents]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: issue-34-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-34-safe-output-parents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fail-closed output parent policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = r'''import fs from "node:fs";
          import path from "node:path";

          const noFollow = process.platform === "win32" ? 0 : (fs.constants.O_NOFOLLOW ?? 0);

          function pathKey(value) {
            const normalized = path.normalize(path.resolve(value));
            return process.platform === "win32" ? normalized.toLowerCase() : normalized;
          }

          function inspectExistingDirectory(directory) {
            const absolute = path.resolve(directory);
            const parsed = path.parse(absolute);
            let current = parsed.root;
            for (const part of absolute.slice(parsed.root.length).split(path.sep).filter(Boolean)) {
              current = path.join(current, part);
              let stats;
              try { stats = fs.lstatSync(current); }
              catch (error) {
                if (error.code === "ENOENT") throw new Error(`Output parent must already exist: ${current}`);
                throw error;
              }
              if (stats.isSymbolicLink()) throw new Error(`Unsafe output parent: symbolic link, junction, or reparse point at ${current}`);
              if (!stats.isDirectory()) throw new Error(`Output parent component is not a directory: ${current}`);
              const real = fs.realpathSync.native(current);
              if (pathKey(real) !== pathKey(current)) throw new Error(`Unsafe output parent traversal from ${current} to ${real}`);
            }
            return absolute;
          }

          export function writeNewTextFile(output, content) {
            const absolute = path.resolve(output);
            inspectExistingDirectory(path.dirname(absolute));
            let descriptor;
            try {
              descriptor = fs.openSync(absolute, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | noFollow, 0o600);
              fs.writeFileSync(descriptor, content, "utf8");
              fs.fsyncSync(descriptor);
              fs.closeSync(descriptor);
              descriptor = undefined;
              return absolute;
            } catch (error) {
              if (descriptor !== undefined) fs.closeSync(descriptor);
              throw error;
            }
          }
          '''
          Path("scripts/lib").mkdir(exist_ok=True)
          Path("scripts/lib/safe-output.mjs").write_text(helper)

          build = Path("scripts/build-criteria-catalog.mjs")
          text = build.read_text()
          import_marker = 'import { fileURLToPath } from "node:url";\n'
          import_line = 'import { writeNewTextFile } from "./lib/safe-output.mjs";\n'
          if import_line not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit("catalog import marker missing")
              text = text.replace(import_marker, import_marker + import_line, 1)
          text = text.replace('  if (fs.existsSync(output)) throw new Error(`Refusing to overwrite existing output: ${output}`);\n', '')
          text = text.replace('  fs.mkdirSync(path.dirname(output), { recursive: true });\n', '')
          old_write = r'''  fs.writeFileSync(output, `${JSON.stringify(catalog, null, 2)}\n`, { encoding: "utf8", flag: "wx" });'''
          new_write = r'''  writeNewTextFile(output, `${JSON.stringify(catalog, null, 2)}\n`);'''
          if old_write in text:
              text = text.replace(old_write, new_write, 1)
          elif new_write not in text:
              raise SystemExit("catalog output write missing")
          build.write_text(text)

          for base in ["codex", "claude"]:
              report = Path(base) / "skills/information-accessibility-practice/scripts/render-audit-report.mjs"
              text = report.read_text()
              mkdir_line = '  fs.mkdirSync(path.dirname(legacyOutput), { recursive: true });\n'
              if mkdir_line not in text:
                  raise SystemExit(f"report output mkdir missing: {report}")
              report.write_text(text.replace(mkdir_line, '', 1))

          Path("tests/safe-output-parent.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import { spawnSync } from "node:child_process";
          import test from "node:test";
          import { fileURLToPath } from "node:url";
          import { writeNewTextFile } from "../scripts/lib/safe-output.mjs";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");

          test("root safe writer refuses to create missing parent directories", () => {
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), "safe-parent-"));
            const output = path.join(temp, "missing", "file.txt");
            assert.throws(() => writeNewTextFile(output, "data"), /must already exist/);
            assert.equal(fs.existsSync(path.dirname(output)), false);
          });

          test("root safe writer refuses symlinked parents", { skip: process.platform === "win32" }, () => {
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), "safe-link-"));
            const real = path.join(temp, "real");
            const link = path.join(temp, "link");
            fs.mkdirSync(real);
            fs.symlinkSync(real, link, "dir");
            assert.throws(() => writeNewTextFile(path.join(link, "file.txt"), "data"), /symbolic link|reparse/);
            assert.equal(fs.existsSync(path.join(real, "file.txt")), false);
          });

          test("standalone report does not create an unverified output parent", () => {
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), "report-parent-"));
            const input = path.join(temp, "audit.json");
            const template = JSON.parse(fs.readFileSync(path.join(root, "codex/skills/information-accessibility-practice/assets/assessment-record.template.json"), "utf8"));
            template.assessment.target.name = "Example";
            template.assessment.target.version_or_commit = "v1";
            template.assessment.target.urls_or_files = ["https://example.invalid/"];
            template.assessment.evaluator = "Reviewer";
            template.assessment.evaluated_at = "2026-08-22";
            fs.writeFileSync(input, JSON.stringify(template));
            const output = path.join(temp, "missing", "report.md");
            const script = path.join(root, "codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs");
            const result = spawnSync(process.execPath, [script, "--input", input, "--output", output], { encoding: "utf8" });
            assert.notEqual(result.status, 0);
            assert.match(result.stderr, /Missing output parent|must already exist/);
            assert.equal(fs.existsSync(path.dirname(output)), false);
          });
          ''')
          PY
      - name: Verify
        run: |
          node --test tests/safe-output-parent.test.mjs tests/audit-report.test.mjs
          node scripts/verify-package.mjs
          node scripts/build-criteria-catalog.mjs --check
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue34.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scripts/lib/safe-output.mjs scripts/build-criteria-catalog.mjs codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs claude/skills/information-accessibility-practice/scripts/render-audit-report.mjs tests/safe-output-parent.test.mjs .github/workflows/one-shot-issue34.yml
          git commit -m "fix: require verified output parent directories"
          git push origin HEAD:fix/issue-34-safe-output-parents
