name: Finalize issue 34
on:
  push:
    branches: [fix/issue-34-safe-output-directories]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-34-safe-output-directories
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply safe output directory handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '''function inspectSafeOutput(output) {
            const absolute = path.resolve(output);
          '''
          helper = '''export function prepareSafeOutputDirectory(directory) {
            const absolute = path.resolve(directory);
            const parsed = path.parse(absolute);
            let current = parsed.root;
            for (const part of absolute.slice(parsed.root.length).split(path.sep).filter(Boolean)) {
              const next = path.join(current, part);
              try {
                const stats = fs.lstatSync(next);
                if (stats.isSymbolicLink() || !stats.isDirectory()) {
                  throw new Error(`Unsafe output directory component: ${next}`);
                }
                const real = fs.realpathSync.native(next);
                if (pathKey(real) !== pathKey(next)) {
                  throw new Error(`Unsafe output directory reparse traversal from ${next} to ${real}`);
                }
              } catch (error) {
                if (error.code !== "ENOENT") throw error;
                fs.mkdirSync(next, { mode: 0o700 });
                inspectRealComponents(next, { type: "directory", label: "output directory" });
              }
              current = next;
            }
            return absolute;
          }

          function inspectSafeOutput(output) {
            const absolute = path.resolve(output);
          '''

          for base in ["codex", "claude"]:
            root = Path(base) / "skills/information-accessibility-practice"
            lib = root / "scripts/lib/audit-run.mjs"
            text = lib.read_text()
            if marker not in text: raise SystemExit(f"output marker missing: {lib}")
            text = text.replace(marker, helper, 1)
            old = '  const parent = inspectRealComponents(path.dirname(absolute), { type: "directory", label: "output parent" });'
            new = '  const parentPath = prepareSafeOutputDirectory(path.dirname(absolute));\n  const parent = inspectRealComponents(parentPath, { type: "directory", label: "output parent" });'
            if old not in text: raise SystemExit(f"parent marker missing: {lib}")
            lib.write_text(text.replace(old, new, 1))

            report = root / "scripts/render-audit-report.mjs"
            report_text = report.read_text()
            report_text = report_text.replace('  fs.mkdirSync(path.dirname(output), { recursive: true });\n', '')
            report.write_text(report_text)

          Path("tests/safe-output-directory.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";
          import test from "node:test";
          import { writeNewText } from "../codex/skills/information-accessibility-practice/scripts/lib/audit-run.mjs";

          test("safe writer creates a missing nested output directory", () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "safe-output-"));
            const output = path.join(root, "one", "two", "report.md");
            writeNewText(output, "report\n");
            assert.equal(fs.readFileSync(output, "utf8"), "report\n");
          });

          test("safe writer refuses to overwrite an existing file", () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "safe-output-existing-"));
            const output = path.join(root, "report.md");
            fs.writeFileSync(output, "sentinel\n");
            assert.throws(() => writeNewText(output, "replacement\n"), /Refusing to overwrite/);
            assert.equal(fs.readFileSync(output, "utf8"), "sentinel\n");
          });

          test("safe writer rejects a symlinked directory component", { skip: process.platform === "win32" }, () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), "safe-output-link-"));
            const real = path.join(root, "real");
            const link = path.join(root, "link");
            fs.mkdirSync(real);
            fs.symlinkSync(real, link, "dir");
            assert.throws(() => writeNewText(path.join(link, "report.md"), "report\n"), /Unsafe output directory|symbolic link|reparse/i);
            assert.equal(fs.existsSync(path.join(real, "report.md")), false);
          });
          ''')
          PY
      - name: Verify
        run: |
          node --test tests/safe-output-directory.test.mjs tests/audit-report.test.mjs
          node scripts/verify-package.mjs
      - name: Commit verified change
        shell: bash
        run: |
          rm .github/workflows/one-shot-issue34.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- codex/skills/information-accessibility-practice/scripts/lib/audit-run.mjs claude/skills/information-accessibility-practice/scripts/lib/audit-run.mjs codex/skills/information-accessibility-practice/scripts/render-audit-report.mjs claude/skills/information-accessibility-practice/scripts/render-audit-report.mjs tests/safe-output-directory.test.mjs .github/workflows/one-shot-issue34.yml
          git commit -m "fix: create output directories through the safe writer"
          git push origin HEAD:fix/issue-34-safe-output-directories
