name: Feature request
description: Propose an evidence-backed workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Use synthetic examples. Security vulnerabilities belong in the private reporting channel."
  - type: input
    id: version
    attributes:
      label: Package version / full commit / schema version
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Target profile / command / artifact type
      description: Enter not applicable if the request is profile-independent.
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: User task and current limitation
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior and acceptance example
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and claim boundary
      description: Distinguish observations, human judgements, assumptions and unperformed tests. Use fictional examples.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public disclosure check
      options:
        - label: I removed secrets, private targets, personal data and raw audit evidence.
          required: true
