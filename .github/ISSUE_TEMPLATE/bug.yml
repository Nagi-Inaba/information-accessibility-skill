name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: commit SHA or release
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile / command
      placeholder: web-modern, jp-public-web, accessibility-audit report, etc.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic data. Do not include credentials, private URLs, local paths, or real audit evidence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and target-specific private evidence.
          required: true
