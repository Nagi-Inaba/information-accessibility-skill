name: Documentation or usability problem
description: Report confusing setup, navigation, CLI output, reports, or workflow friction
title: "[Usability] "
labels: [documentation, usability]
body:
  - type: markdown
    attributes:
      value: "This form is public. Use fictional targets; security reports belong in the private reporting channel."
  - type: input
    id: version
    attributes:
      label: Package version / full commit / schema version
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Target profile / command / documentation page
      description: Enter not applicable for a profile-independent request.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - README / onboarding
        - CLI / help
        - WCAG / JIS reference lookup
        - Audit workflow
        - Human review workflow
        - Report output
        - Installation / upgrade
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was difficult or unclear?
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction context and evidence boundary
      description: Give the synthetic steps, expected result and environment. Distinguish an observation from an untested suggestion.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public disclosure check
      options:
        - label: I removed secrets, private targets, personal data and raw audit evidence.
          required: true
